<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — CV 2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/design.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { DEFAULT: '#4F46E5', light: '#818CF8', dark: '#3730A3' }
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/app.js"></script>
</head>
<body class="bg-white min-h-screen font-sans antialiased flex flex-col">
    <!-- Minimal nav -->
    <nav class="h-16 flex items-center px-6">
        <a href="/" class="text-xl font-bold tracking-tight text-gray-900">CV<span class="text-brand">2.0</span></a>
    </nav>

    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-sm animate-in">
            <!-- Header -->
            <div class="mb-8">
                <h1 class="text-h1 text-gray-900" id="auth-title">Sign in</h1>
                <p class="text-small text-gray-500 mt-2" id="auth-subtitle">Welcome back. Enter your credentials to continue.</p>
            </div>

            <!-- Tab Toggle -->
            <div class="flex mb-8 border-b border-gray-100">
                <button id="tab-signin" onclick="switchTab('signin')"
                    class="pb-3 px-1 mr-6 text-sm font-medium border-b-2 border-brand text-gray-900 transition">
                    Sign In
                </button>
                <button id="tab-signup" onclick="switchTab('signup')"
                    class="pb-3 px-1 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-600 transition">
                    Create Account
                </button>
            </div>

            <!-- Error/Success Messages -->
            <div id="auth-message" class="hidden mb-6 p-3 rounded-lg text-sm"></div>

            <!-- Form -->
            <form id="auth-form" onsubmit="handleSubmit(event)">
                <div class="space-y-5">
                    <div>
                        <label for="email" class="input-label">Email</label>
                        <input type="email" id="email" required
                            class="input"
                            placeholder="you@example.com">
                    </div>
                    <div>
                        <label for="password" class="input-label">Password</label>
                        <input type="password" id="password" required minlength="6"
                            class="input"
                            placeholder="Min. 6 characters">
                    </div>

                    <!-- Confirm password (signup only) -->
                    <div id="confirm-field" class="hidden">
                        <label for="confirm" class="input-label">Confirm Password</label>
                        <input type="password" id="confirm"
                            class="input"
                            placeholder="Repeat your password">
                    </div>
                </div>

                <button type="submit" id="submit-btn"
                    class="btn btn-primary w-full mt-8 disabled:opacity-50 disabled:cursor-not-allowed">
                    Sign In
                </button>
            </form>

            <!-- Divider -->
            <div class="mt-8 flex items-center gap-4">
                <div class="flex-1 h-px bg-gray-100"></div>
                <span class="text-caption text-gray-400">or</span>
                <div class="flex-1 h-px bg-gray-100"></div>
            </div>

            <!-- Demo Mode -->
            <button onclick="demoSignIn()"
                class="btn btn-secondary w-full mt-6 text-sm">
                Try Demo Mode
            </button>

            <!-- Footer note -->
            <p class="text-caption text-gray-400 mt-8 text-center">
                By continuing, you agree to our Terms of Service and Privacy Policy.
            </p>
        </div>
    </main>

<script>
    let currentTab = 'signin';

    const params = new URLSearchParams(window.location.search);
    if (params.get('mode') === 'signup') {
        switchTab('signup');
    }

    document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            if (APP.isAuthenticated()) {
                const redirect = params.get('redirect') || '/dashboard.html';
                window.location.href = redirect;
            }
        }, 100);
    });

    function switchTab(tab) {
        currentTab = tab;
        const signinBtn = document.getElementById('tab-signin');
        const signupBtn = document.getElementById('tab-signup');
        const confirmField = document.getElementById('confirm-field');
        const submitBtn = document.getElementById('submit-btn');
        const title = document.getElementById('auth-title');
        const subtitle = document.getElementById('auth-subtitle');

        if (tab === 'signin') {
            signinBtn.className = 'pb-3 px-1 mr-6 text-sm font-medium border-b-2 border-brand text-gray-900 transition';
            signupBtn.className = 'pb-3 px-1 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-600 transition';
            confirmField.classList.add('hidden');
            submitBtn.textContent = 'Sign In';
            title.textContent = 'Sign in';
            subtitle.textContent = 'Welcome back. Enter your credentials to continue.';
        } else {
            signupBtn.className = 'pb-3 px-1 text-sm font-medium border-b-2 border-brand text-gray-900 transition';
            signinBtn.className = 'pb-3 px-1 mr-6 text-sm font-medium border-b-2 border-transparent text-gray-400 hover:text-gray-600 transition';
            confirmField.classList.remove('hidden');
            submitBtn.textContent = 'Create Account';
            title.textContent = 'Create account';
            subtitle.textContent = 'Set up your AI agent in minutes.';
        }
        hideMessage();
    }

    async function handleSubmit(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const submitBtn = document.getElementById('submit-btn');

        if (currentTab === 'signup') {
            const confirm = document.getElementById('confirm').value;
            if (password !== confirm) {
                showMessage('Passwords do not match.', 'error');
                return;
            }
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Please wait...';

        try {
            let result;
            if (currentTab === 'signin') {
                result = await APP.signIn(email, password);
            } else {
                result = await APP.signUp(email, password);
            }

            if (result.error) {
                showMessage(result.error.message || 'Authentication failed.', 'error');
            } else {
                if (currentTab === 'signup') {
                    showMessage('Account created successfully.', 'success');
                }
                const redirect = params.get('redirect') || '/dashboard.html';
                window.location.href = redirect;
            }
        } catch (err) {
            showMessage('Connection error. Please try again.', 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = currentTab === 'signin' ? 'Sign In' : 'Create Account';
        }
    }

    async function demoSignIn() {
        const demoId = 'demo-' + Math.random().toString(36).slice(2, 8);
        await APP.signIn(demoId + '@demo.cv2', 'demo-mode');
        window.location.href = '/dashboard.html';
    }

    function showMessage(text, type) {
        const el = document.getElementById('auth-message');
        el.textContent = text;
        el.className = `mb-6 p-3 rounded-lg text-sm ${
            type === 'error' ? 'bg-red-50 text-red-700 border border-red-100' : 'bg-green-50 text-green-700 border border-green-100'
        }`;
        el.classList.remove('hidden');
    }

    function hideMessage() {
        document.getElementById('auth-message').classList.add('hidden');
    }
</script>
</body>
</html>
