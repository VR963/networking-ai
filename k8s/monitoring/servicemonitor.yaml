apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fastapi-metrics
  namespace: networking-ai
  labels:
    app: fastapi
    release: prometheus
spec:
  selector:
    matchLabels:
      app: fastapi
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

