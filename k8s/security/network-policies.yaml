  namespace: networking-ai
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    # Allow from FastAPI pods
    - from:
        - podSelector:
            matchLabels:
              app: fastapi
      ports:
        - protocol: TCP
          port: 5432

    # Allow from WebSocket pods
    - from:
        - podSelector:
            matchLabels:
              app: websocket
      ports:
        - protocol: TCP
          port: 5432

    # Allow from Worker pods
    - from:
        - podSelector:
            matchLabels:
              app: worker
      ports:
        - protocol: TCP
          port: 5432

