name: Deploy to Kubernetes

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build and push Docker image
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_ENV=production
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Run tests
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests
        run: |
          pytest --cov=networking_ai --cov-report=xml --cov-report=term -v
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Check test coverage
        run: |
          coverage report --fail-under=99

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: true

  # Deploy to staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging.networking-ai.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Create namespace if not exists
        run: |
          kubectl create namespace networking-ai --dry-run=client -o yaml | kubectl apply -f -

      - name: Create/Update secrets
        run: |
          kubectl create secret generic networking-ai-secrets \
            --from-literal=POSTGRES_USER=${{ secrets.POSTGRES_USER }} \
            --from-literal=POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
            --from-literal=REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }} \
            --from-literal=ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }} \
            --from-literal=SECRET_KEY=${{ secrets.SECRET_KEY }} \
            --from-literal=JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }} \
            --namespace networking-ai \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/base/ -n networking-ai
          kubectl set image deployment/fastapi fastapi=${{ needs.build.outputs.image-tag }} -n networking-ai
          kubectl set image deployment/websocket websocket=${{ needs.build.outputs.image-tag }} -n networking-ai

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/fastapi -n networking-ai --timeout=5m
          kubectl rollout status deployment/websocket -n networking-ai --timeout=5m

      - name: Run smoke tests
        run: |
          kubectl run smoke-test --image=${{ needs.build.outputs.image-tag }} \
            --restart=Never \
            --namespace=networking-ai \
            --command -- python -m pytest tests/ -v -k "smoke"
          kubectl wait --for=condition=complete --timeout=5m job/smoke-test -n networking-ai

      - name: Notify deployment success
        if: success()
        run: echo "Deployment to staging successful!"

  # Deploy to production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build, test, deploy-staging]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://networking-ai.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Create namespace if not exists
        run: |
          kubectl create namespace networking-ai --dry-run=client -o yaml | kubectl apply -f -

      - name: Create/Update secrets
        run: |
          kubectl create secret generic networking-ai-secrets \
            --from-literal=POSTGRES_USER=${{ secrets.POSTGRES_USER_PROD }} \
            --from-literal=POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD_PROD }} \
            --from-literal=REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD_PROD }} \
            --from-literal=ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }} \
            --from-literal=SECRET_KEY=${{ secrets.SECRET_KEY_PROD }} \
            --from-literal=JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY_PROD }} \
            --namespace networking-ai \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes (Blue-Green)
        run: |
          # Apply all manifests
          kubectl apply -f k8s/base/ -n networking-ai

          # Create green deployment
          kubectl apply -f k8s/overlays/prod/ -n networking-ai

          # Update image
          kubectl set image deployment/fastapi-green fastapi=${{ needs.build.outputs.image-tag }} -n networking-ai
          kubectl set image deployment/websocket-green websocket=${{ needs.build.outputs.image-tag }} -n networking-ai

          # Wait for green deployment
          kubectl rollout status deployment/fastapi-green -n networking-ai --timeout=10m
          kubectl rollout status deployment/websocket-green -n networking-ai --timeout=10m

      - name: Run production smoke tests
        run: |
          kubectl run smoke-test-prod --image=${{ needs.build.outputs.image-tag }} \
            --restart=Never \
            --namespace=networking-ai \
            --command -- python -m pytest tests/ -v -k "smoke"
          kubectl wait --for=condition=complete --timeout=5m job/smoke-test-prod -n networking-ai

      - name: Switch traffic to green (Canary 10%)
        run: |
          kubectl patch service fastapi-service -n networking-ai -p '{"spec":{"selector":{"version":"green","weight":"10"}}}'
          echo "Canary deployment: 10% traffic to green"
          sleep 300  # Wait 5 minutes

      - name: Monitor metrics
        run: |
          # Check error rate, response time, etc.
          # If metrics are good, continue; otherwise, rollback
          echo "Monitoring metrics..."

      - name: Switch traffic to green (50%)
        run: |
          kubectl patch service fastapi-service -n networking-ai -p '{"spec":{"selector":{"version":"green","weight":"50"}}}'
          echo "Canary deployment: 50% traffic to green"
          sleep 300  # Wait 5 minutes

      - name: Switch traffic to green (100%)
        run: |
          kubectl patch service fastapi-service -n networking-ai -p '{"spec":{"selector":{"version":"green"}}}'
          kubectl patch service websocket-service -n networking-ai -p '{"spec":{"selector":{"version":"green"}}}'
          echo "Full traffic to green deployment"

      - name: Scale down blue deployment
        run: |
          kubectl scale deployment/fastapi --replicas=0 -n networking-ai
          kubectl scale deployment/websocket --replicas=0 -n networking-ai
          echo "Blue deployment scaled down"

      - name: Notify deployment success
        if: success()
        run: echo "Production deployment successful!"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed! Rolling back..."
          kubectl patch service fastapi-service -n networking-ai -p '{"spec":{"selector":{"version":"blue"}}}'
          kubectl patch service websocket-service -n networking-ai -p '{"spec":{"selector":{"version":"blue"}}}'
          kubectl scale deployment/fastapi-green --replicas=0 -n networking-ai
          kubectl scale deployment/websocket-green --replicas=0 -n networking-ai
